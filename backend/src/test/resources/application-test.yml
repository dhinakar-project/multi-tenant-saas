spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=value
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

clerk:
  jwks-url: https://example.clerk.accounts.dev/.well-known/jwks.json
  issuer: https://example.clerk.accounts.dev

gemini:
  api-key: test-key
  model: gemini-2.0-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info
