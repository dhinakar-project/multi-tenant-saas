server:
  port: 8080
  address: 0.0.0.0  # Bind to all interfaces for LAN access

spring:
  application:
     name: saas-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/multitenant_saas?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Clerk Authentication Configuration
clerk:
  jwks-url: ${CLERK_JWKS_URL:https://leading-mackerel-20.clerk.accounts.dev/.well-known/jwks.json}
  issuer: ${CLERK_ISSUER:https://leading-mackerel-20.clerk.accounts.dev}
  # Optional: Add authorized party (azp) validation if needed
  # authorized-party: your-clerk-frontend-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

# Google Gemini AI Configuration
# Key is injected via GEMINI_API_KEY environment variable
gemini:
  api-key: ${GEMINI_API_KEY:}
  api:
    key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash

# Vapi Voice AI Configuration
vapi:
  public-key: ${VAPI_PUBLIC_KEY:}
  assistant-id: ${VAPI_ASSISTANT_ID:}
  backend-url: ${VAPI_BACKEND_URL:http://localhost:8081}

