server:
  port: 8080
  address: 0.0.0.0  # Bind to all interfaces for LAN access

spring:
  application:
     name: saas-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/multitenant_saas?allowPublicKeyRetrieval=true&useSSL=false
    username: saas_user
    password: Saas@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Clerk Authentication Configuration
clerk:
  jwks-url: ${CLERK_JWKS_URL:https://leading-mackerel-20.clerk.accounts.dev/.well-known/jwks.json}
  issuer: ${CLERK_ISSUER:https://leading-mackerel-20.clerk.accounts.dev}
  # Optional: Add authorized party (azp) validation if needed
  # authorized-party: your-clerk-frontend-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
