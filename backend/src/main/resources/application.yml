server:
  port: 8080
  address: 0.0.0.0  # Bind to all interfaces for LAN access

spring:
  application:
     name: saas-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/multitenant_saas
    username: saas_user
    password: Saas@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      # generate your own long random string (64+ chars). Don't keep "dev" in prod.
      secret-key: "dev-CHANGE-ME-TO-A-LONG-RANDOM-SECRET-64-CHARS-MIN-please"
      expiration: 86400000   # 1 day (ms)
      refresh-token:
        expiration: 604800000 # 7 days (ms)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
