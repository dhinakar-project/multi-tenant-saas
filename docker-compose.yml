services:
  mysql:
    image: mysql:8.0
    container_name: mt_mysql
    environment:
      MYSQL_DATABASE: multitenant_saas
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: Saas@123
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mt_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/multitenant_saas?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: saas_user
      SPRING_DATASOURCE_PASSWORD: Saas@123
      APPLICATION_SECURITY_JWT_SECRET_KEY: dev-secret
      # Gemini AI — reads from your host shell env var (set before running docker compose)
      GEMINI_API_KEY: AIzaSyAth41_sCXP3kiRMcZBypOFO6PyiRmgJxo
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mt_frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
