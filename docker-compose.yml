version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mt_mysql
    environment:
      MYSQL_DATABASE: multitenant_saas
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mt_backend
    restart: unless-stopped
    env_file:
      - .env.local        # auto-loads VAPI_PUBLIC_KEY, VAPI_ASSISTANT_ID, VAPI_BACKEND_URL, GEMINI_API_KEY
    environment:
      # These override / supplement env_file values
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/multitenant_saas?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build: ./frontend
    container_name: mt_frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data: